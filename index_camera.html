<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>주차 차량 확인기 실전형</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Pretendard,sans-serif;background:#f4f7fb;margin:0;padding:16px;text-align:center}h2{color:#2b4eff;margin:8px 0 14px}input{font-size:2em;padding:10px;width:220px;border-radius:12px;border:1px solid #ccc;text-align:center}button{font-size:1.05rem;padding:11px 14px;margin:4px;border:none;border-radius:12px;background:#2b4eff;color:#fff}button.gray{background:#666}button:active{transform:scale(.98)}#status{min-height:30px;font-weight:700;margin:10px}video,canvas{width:100%;max-width:430px;border-radius:14px;background:#000;margin:8px auto;display:block}table{margin:12px auto;border-collapse:collapse;width:100%;max-width:780px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08)}th,td{border:1px solid #ddd;padding:10px}th{background:#eef2ff}img.car{width:120px;border-radius:10px}
</style>
</head>
<body>
<h2>🚗 주차 차량 확인기 (실전형)</h2>
<input id="carInput" placeholder="4자리 번호" maxlength="4">
<div>
<button id="searchBtn" onclick="handleSearchButton()">조회</button>
<button onclick="startVoice()">🎙 음성조회</button>
<button onclick="startCamera()">📷 카메라</button>
<button onclick="captureAndSearch()">📸 촬영조회</button>
</div>
<div id="status"></div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none"></canvas>
<table id="resultTable" style="display:none">
<thead><tr><th>차량사진</th><th>번호</th><th>색상</th><th>차종</th><th>주차스티커</th></tr></thead><tbody></tbody></table>
<script>
const carData=[
{번호:'0114',주차스티커:'있음(황색)',색상:'흰색',차종:'레이',사진:'images/0114.jpg'},
{번호:'0136',주차스티커:'있음(황색)',색상:'흰색',차종:'아우디',사진:'images/0136.jpg'},
{번호:'2458',주차스티커:'없음',색상:'검정',차종:'소나타',사진:'images/default.jpg'}
];
let stream=null;
const $=id=>document.getElementById(id);
function setStatus(t){$('status').innerText=t;}
function resetSearch(){$('searchBtn').innerText='조회';$('carInput').value='';$('resultTable').style.display='none';$('resultTable').querySelector('tbody').innerHTML='';setStatus('');$('carInput').focus();}
function showResult(car){$('searchBtn').innerText='재검색';$('resultTable').querySelector('tbody').innerHTML=`<tr><td><img class="car" src="${car.사진}" onerror="this.src='images/default.jpg'"></td><td>${car.번호}</td><td>${car.색상}</td><td>${car.차종}</td><td>${car.주차스티커}</td></tr>`;$('resultTable').style.display='table';}
function checkCar(){const num=$('carInput').value.trim();if(num.length!==4){setStatus('⚠ 4자리 번호를 입력하세요');return;}const car=carData.find(v=>v.번호===num);if(car){setStatus('✅ 차량 확인 완료');showResult(car);}else{$('resultTable').style.display='none';setStatus('❌ 등록되지 않은 차량입니다');}}
function handleSearchButton(){if($('searchBtn').innerText==='재검색')resetSearch();else checkCar();}
function startVoice(){if(!('webkitSpeechRecognition' in window)){alert('이 브라우저는 음성인식을 지원하지 않습니다');return;}resetSearch();const r=new webkitSpeechRecognition();r.lang='ko-KR';r.onresult=e=>{const txt=e.results[0][0].transcript;const n=txt.replace(/[^0-9]/g,'').slice(-4);$('carInput').value=n;checkCar();};r.start();setStatus('🎙 말씀하세요...');}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('video').srcObject=stream;setStatus('📷 카메라 준비 완료');}catch(e){setStatus('카메라 권한을 허용해주세요');}}
async function captureAndSearch(){if(!$('video').srcObject){await startCamera();return;}const v=$('video'),c=$('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);setStatus('🔍 번호판 인식중...');try{const res=await Tesseract.recognize(c,'kor+eng');const digits=(res.data.text.match(/\d/g)||[]).join('');const num=digits.slice(-4);if(num.length===4){$('carInput').value=num;setStatus('📸 인식번호: '+num);checkCar();}else setStatus('번호판 인식 실패 (가까이 촬영하세요)');}catch(err){setStatus('OCR 오류 발생');}}
$('carInput').addEventListener('keyup',e=>{if(e.key==='Enter')checkCar();});
</script>
</body>
</html>
